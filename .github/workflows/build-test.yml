name: Build tests
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-test.yml
      - scripts/*.sh
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-test.yml
      - scripts/*.sh

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor:
          - gnu
          - intel
      fail-fast: false

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build ${{ matrix.flavor }} flavor
        run: bash scripts/openmx_${{ matrix.flavor }}.sh
