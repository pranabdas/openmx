name: Build tests

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-test.yml
      - scripts/*.sh
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-test.yml
      - scripts/*.sh

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor:
          - gnu
          - intel
      fail-fast: false

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build ${{ matrix.flavor }} flavor
        run: bash scripts/openmx_${{ matrix.flavor }}.sh
