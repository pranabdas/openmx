name: Build tests

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-test.yml
      - scripts/*.sh
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-test.yml
      - scripts/*.sh

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flavor:
          - gnu
          - intel
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build ${{ matrix.flavor }} flavor
        run: bash scripts/openmx_${{ matrix.flavor }}.sh
